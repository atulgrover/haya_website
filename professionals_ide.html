<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professionals IDE | Private Desktop Workspace &amp; Law Library | HAYAGRIVA</title>
  <meta name="description" content="Private Desktop Workspace for Lawyers, CAs, Insolvency Practitioners, and Legal Professionals with 100% offline data privacy, Indian law books, and smart AI assistants.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Google+Sans:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Noto+Serif+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/ide-docking.css">

  <style>
    :root {
      --bg-primary: #F8F9FA;
      --bg-card: #FFFFFF;
      --bg-accent: #EFF6FF;
      --text-main: #212121;
      --text-muted: #5F6368;
      --primary-color: #1E6C93;
      --primary-hover: #165272;
      --primary-light: rgba(30, 108, 147, 0.1);
      --border-color: #E2E8F0;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --hover-shadow: 0 10px 15px -3px rgba(30, 108, 147, 0.12), 0 4px 6px -2px rgba(30, 108, 147, 0.05);
      --font-main: 'Lato', sans-serif;
      --font-heading: 'Google Sans', sans-serif;
      --font-mono: 'Roboto Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-main); background-color: var(--bg-primary); color: var(--text-main); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; margin: 0; }
    a { color: var(--primary-color); text-decoration: none; transition: color 0.2s ease; }
    a:hover { color: var(--primary-hover); }

    /* 3-Panel IDE Layout Container */
    .ide-container { display: flex; flex: 1; min-height: calc(100vh - 64px); width: 100%; }

    /* LEFT PANEL: Streamlined Professional IDE Practices Directory */
    .panel-left {
      width: 270px; min-width: 250px; background: #FFFFFF; border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; flex-shrink: 0; padding: 16px 14px; gap: 12px;
      overflow-y: auto; z-index: 100;
    }
    .panel-title { font-family: var(--font-heading); font-size: 15px; font-weight: 700; color: var(--text-main); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 4px; }
    
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filter-input {
      padding: 9px 12px; border: 1px solid var(--border-color); border-radius: 8px;
      font-size: 13px; background: #FFFFFF; color: var(--text-main); outline: none; width: 100%;
      transition: all 0.2s ease;
    }
    .filter-input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--primary-light); }

    .role-list { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
    .role-item {
      padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border-color);
      background: #FFFFFF; cursor: pointer; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column; gap: 4px;
    }
    .role-item:hover {
      border-color: var(--primary-color); background-color: #F8FAFC; transform: translateY(-1px);
    }
    .role-item.active {
      border-color: var(--primary-color); background-color: var(--primary-light);
      box-shadow: 0 2px 6px rgba(30, 108, 147, 0.12);
    }
    .role-title-row { display: flex; align-items: center; gap: 8px; }
    .role-icon { font-size: 15px; line-height: 1; flex-shrink: 0; }
    .role-title { font-size: 13.5px; font-weight: 700; color: var(--text-main); }
    .role-item.active .role-title { color: var(--primary-color); }
    .role-meta { font-size: 11.5px; color: var(--text-muted); padding-left: 23px; }

    /* CENTER PANEL: WORKBENCH Core Engine + 6 Standalone Segment Cards */
    .panel-center { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; background: var(--bg-primary); }
    
    .workspace-header { background: #FFFFFF; border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; box-shadow: var(--card-shadow); }
    .role-header-title { font-family: var(--font-heading); font-size: 24px; font-weight: 700; margin-bottom: 6px; color: var(--primary-color); }
    .role-header-desc { font-size: 14px; color: var(--text-muted); line-height: 1.5; }

    /* Interactive IDE Simulator Component */
    .ide-simulator {
      background-color: #1E293B; color: #F8FAFC; border-radius: 12px; overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25); border: 1px solid #334155; width: 100%; min-height: 360px;
    }
    .ide-header {
      background-color: #0F172A; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #334155;
    }
    .ide-dots { display: flex; gap: 8px; }
    .ide-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .dot-red { background-color: #EF4444; }
    .dot-yellow { background-color: #F59E0B; }
    .dot-green { background-color: #10B981; }
    .ide-title { font-family: var(--font-mono); font-size: 13px; color: #94A3B8; font-weight: 500; }
    
    .ide-body { display: grid; grid-template-columns: 240px 1fr 280px; min-height: 320px; }
    @media (max-width: 1200px) { .ide-body { grid-template-columns: 200px 1fr; } .ide-panel { display: none; } }

    .ide-sidebar { background-color: #0F172A; border-right: 1px solid #334155; padding: 16px; font-size: 13px; }
    .ide-tree-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #64748B; margin-bottom: 10px; font-weight: 700; }
    .ide-tree-item { padding: 6px 10px; border-radius: 4px; cursor: pointer; color: #CBD5E1; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12.5px; transition: background 0.2s; }
    .ide-tree-item.active, .ide-tree-item:hover { background-color: #334155; color: #38BDF8; }

    .ide-editor { padding: 16px; font-family: var(--font-mono); font-size: 13px; overflow-y: auto; background-color: #1E293B; }
    .ide-code-line { line-height: 1.6; color: #E2E8F0; }
    .code-keyword { color: #F43F5E; }
    .code-string { color: #10B981; }
    .code-comment { color: #64748B; font-style: italic; }
    .code-var { color: #38BDF8; }

    .ide-panel { background-color: #0F172A; border-left: 1px solid #334155; padding: 16px; font-size: 12px; }
    .ide-panel-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #64748B; margin-bottom: 10px; font-weight: 700; }
    .ide-panel-content { color: #94A3B8; line-height: 1.5; }

    /* 6 Standalone Segment Engine Cards Grid */
    .segments-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .segment-card {
      background: #FFFFFF; border: 1px solid var(--border-color); border-radius: 12px;
      padding: 18px 20px; box-shadow: var(--card-shadow); transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column; justify-content: flex-start;
      cursor: pointer; position: relative; user-select: none;
    }
    .segment-card:hover {
      transform: translateY(-3px); box-shadow: var(--hover-shadow); border-color: var(--primary-color);
      background-color: #FAFCFE;
    }
    .segment-card:active {
      transform: translateY(-1px);
    }
    .segment-card:focus-visible {
      outline: 2px solid var(--primary-color); outline-offset: 2px;
    }
    .segment-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .segment-badge { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--primary-color); background: var(--primary-light); padding: 3px 8px; border-radius: 4px; }
    .segment-arrow { font-size: 13px; font-weight: 700; color: var(--text-muted); transition: transform 0.2s ease, color 0.2s ease; }
    .segment-card:hover .segment-arrow { transform: translateX(3px); color: var(--primary-color); }
    .segment-title { font-family: var(--font-heading); font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
    .segment-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 0; }

    /* RIGHT PANEL: Gateway & Marketplace Inspector */
    .panel-right {
      width: 380px; min-width: 320px; background: #FFFFFF; border-left: 1px solid var(--border-color);
      display: none; flex-direction: column; flex-shrink: 0; padding: 20px; gap: 16px;
      position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto;
    }
    .panel-right.active { display: flex; }
    .inspector-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
    .btn-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }
    .btn-close:hover { color: var(--text-main); }
    .inspector-section { background: #F8FAFC; border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .inspector-sec-title { font-family: var(--font-heading); font-size: 14px; font-weight: 700; margin-bottom: 6px; color: var(--primary-color); }
    .inspector-sec-text { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }

    /* Order Form in Inspector */
    .order-form { display: flex; flex-direction: column; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 12px; font-weight: 700; color: var(--text-main); }
    .form-input, .form-textarea {
      padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px;
      font-size: 13px; font-family: var(--font-main); outline: none;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--primary-color); }
    .btn-order-submit {
      background: var(--primary-color); color: #FFFFFF; border: none; padding: 10px;
      border-radius: 6px; font-weight: 700; font-size: 13.5px; cursor: pointer; transition: background 0.2s ease;
    }
    .btn-order-submit:hover { background: var(--primary-hover); }

    @media (max-width: 1024px) {
      .ide-container { flex-direction: column; }
      .panel-left, .panel-right { width: 100%; position: static; height: auto; }
    }
  </style>
</head>
<body>

  <!-- Universal Header Mount Point (Hydrated by js/components.js) -->
  <div id="site-header" data-pillar="professionals_ide"></div>

  <!-- Panel scrim (mobile overlay backdrop) -->
  <div class="panel-scrim" id="panelScrim"></div>

  <!-- 3-Panel IDE Layout Container -->
  <div class="ide-container" id="ideContainer">

    <!-- Floating Restore Button when Left Sidebar is Collapsed -->
    <button id="btnRestoreLeft" class="ide-restore-left-btn">
      <span>▶</span> Show Professional IDEs (Cmd+B)
    </button>

    <!-- LEFT PANEL: Streamlined Professional IDE Practices Directory -->
    <aside class="panel-left" id="panelLeft">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
        <h2 class="panel-title" style="margin-bottom: 0;">Professional IDEs</h2>
        <button class="ide-btn-icon" onclick="HayaIdeDocking.toggleLeftPanel(false)" title="Collapse Sidebar (Cmd+B)">◀</button>
      </div>

      <!-- Keyword Search -->
      <div class="filter-group">
        <input type="text" id="searchRole" class="filter-input" placeholder="🔍 Search professional practice..." oninput="handleCombinedFilter()">
      </div>

      <!-- Filtered Professional Practice Cards List -->
      <div class="role-list" id="roleList">
        <!-- Professional Roles loaded dynamically -->
      </div>
    </aside>

    <!-- CENTER PANEL: WORKBENCH IDE Window + 6 Standalone Engine Cards -->
    <main class="panel-center" id="panelCenter">
      <!-- Mobile filter toggle -->
      <button class="filter-drawer-toggle" id="filterDrawerToggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/>
        </svg>
        Filter Professional Practices
      </button>

      <div class="results-header">
        <span class="results-count" id="resultsCount">Loading Professional Practice Environments...</span>
      </div>

      <!-- Live Role-Dynamic WORKBENCH IDE Window -->
      <div class="ide-simulator" id="workbenchIdeSimulator">
        <!-- Dynamically rendered per selected role -->
      </div>

      <!-- 6 Standalone Segment Engine Cards Grid -->
      <div class="segments-grid" id="segmentsGrid">
        <!-- 6 Standalone Cards loaded dynamically -->
      </div>

    </main>

    <!-- RIGHT PANEL: Gateway & Marketplace Inspector -->
    <aside class="panel-right collapsed" id="panelRight">
      <div class="inspector-header">
        <h2 class="panel-title" id="inspectorTitle">Inspector</h2>
        <div class="inspector-actions-bar">
          <button class="ide-btn-icon" onclick="HayaIdeDocking.maximizeRightPanel()" title="Maximize / Restore View (Esc)">⤢</button>
          <button class="ide-btn-icon" onclick="closeInspector()" title="Close Inspector (Esc)">✕</button>
        </div>
      </div>

      <div id="inspectorContent">
        <!-- Dynamic inspector content rendered when "More Details" is clicked -->
      </div>
    </aside>

  </div>

  <!-- Unified Dark Deep Blue Footer Container (Loaded dynamically via components/footer.html) -->
  <div id="site-footer"></div>

  <script>
    let allRoles = [];
    let filteredRoles = [];
    let activeRole = null;

    window.addEventListener('DOMContentLoaded', () => {
      if (window.HayaIdeDocking) {
        HayaIdeDocking.init({ storagePrefix: 'haya_professionals_ide_' });
      }
      loadProfessionalRoles();
      checkAuthStatus();
    });

    async function loadProfessionalRoles() {
      try {
        const res = await fetch('/api/wiki/professional-roles');
        const data = await res.json();
        if (data.success && data.roles.length > 0) {
          allRoles = data.roles;
          filteredRoles = [...allRoles];
          renderRoleList(filteredRoles);
          selectRole(allRoles[0].id);
        }
      } catch (err) { console.error(err); }
    }

    function renderRoleList(roles) {
      const list = document.getElementById('roleList');
      const countSpan = document.getElementById('resultsCount');

      if (countSpan) {
        const q = (document.getElementById('searchRole') ? document.getElementById('searchRole').value.trim() : '');
        if (q) {
          countSpan.innerText = `Showing ${roles ? roles.length : 0} matching Professional IDE Workspaces`;
        } else {
          countSpan.innerText = `Showing ${roles ? roles.length : 0} of ${allRoles.length || 4} Professional IDE Workspaces`;
        }
      }

      if (!roles || roles.length === 0) {
        list.innerHTML = `<div style="padding: 16px 8px; text-align: center; color: var(--text-muted); font-size: 12px;">No matching Professional environments found.</div>`;
        return;
      }

      const categoryIcons = {
        'Intellectual Property': '🛡️',
        'Insolvency & Bankruptcy': '⚖️',
        'Corporate & Litigation': '🏛️',
        'Arbitration & Contracts': '📜'
      };

      list.innerHTML = roles.map(r => {
        const icon = categoryIcons[r.category] || '⚖️';
        const isActive = activeRole && activeRole.id === r.id;
        return `
          <div class="role-item ${isActive ? 'active' : ''}" onclick="selectRole('${r.id}')">
            <div class="role-title-row">
              <span class="role-icon">${icon}</span>
              <span class="role-title">${r.role_title}</span>
            </div>
            <span class="role-meta">${r.category || 'Practice'}</span>
          </div>
        `;
      }).join('');
    }

    function handleCombinedFilter() {
      const q = (document.getElementById('searchRole') ? document.getElementById('searchRole').value : '').trim().toLowerCase();

      filteredRoles = allRoles.filter(r => {
        if (!q) return true;
        const matchTitle = (r.role_title || '').toLowerCase().includes(q);
        const matchDesc = (r.description || '').toLowerCase().includes(q);
        const matchCat = (r.category || '').toLowerCase().includes(q);
        const matchLLM = (r.llm && r.llm.model_name ? r.llm.model_name : '').toLowerCase().includes(q);
        const matchStatute = (r.gateway && r.gateway.statutory_body ? r.gateway.statutory_body : '').toLowerCase().includes(q);
        return matchTitle || matchDesc || matchCat || matchLLM || matchStatute;
      });

      renderRoleList(filteredRoles);

      // If active role is no longer in filtered list, select the first available
      if (filteredRoles.length > 0) {
        if (!activeRole || !filteredRoles.some(r => r.id === activeRole.id)) {
          selectRole(filteredRoles[0].id);
        }
      }
    }

    function resetFilters() {
      const searchInput = document.getElementById('searchRole');
      if (searchInput) searchInput.value = '';
      filteredRoles = [...allRoles];
      renderRoleList(filteredRoles);
      if (allRoles.length > 0) {
        selectRole(allRoles[0].id);
      }
    }

    function selectRole(roleId) {
      activeRole = allRoles.find(r => r.id === roleId);
      if (!activeRole) return;

      renderRoleList(filteredRoles);
      closeInspector();

      // Render Dynamic WORKBENCH IDE Window tailored for activeRole
      renderWorkbenchIdeSimulator(activeRole);

      // Render 6 Standalone Cards Grid
      const grid = document.getElementById('segmentsGrid');
      grid.innerHTML = `
        <!-- Card 1: Embedding Models -->
        <div class="segment-card" onclick="openInspector('embeddings')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')openInspector('embeddings')" title="Click to view Embedding Model specs">
          <div class="segment-header">
            <span class="segment-badge">BRAIN / VECTORS</span>
            <span class="segment-arrow">➔</span>
          </div>
          <h3 class="segment-title">🧠 Embedding Models</h3>
          <p class="segment-desc">
            <strong>Model:</strong> <code>${activeRole.embeddings.model_name}</code> (${activeRole.embeddings.dimensions}-dim)<br/>
            <strong>Scope:</strong> ${activeRole.embeddings.scope}
          </p>
        </div>

        <!-- Card 2: LLM Engines -->
        <div class="segment-card" onclick="openInspector('llm')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')openInspector('llm')" title="Click to view LLM Reasoning Engine specs">
          <div class="segment-header">
            <span class="segment-badge">REASONING ENGINE</span>
            <span class="segment-arrow">➔</span>
          </div>
          <h3 class="segment-title">⚡ LLM Reasoning Engines</h3>
          <p class="segment-desc">
            <strong>Primary LLM:</strong> <code>${activeRole.llm.model_name}</code><br/>
            <strong>Air-Gapped:</strong> ${activeRole.llm.local_gguf}
          </p>
        </div>

        <!-- Card 3: Domain Vault Assets -->
        <div class="segment-card" onclick="openInspector('vaults')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')openInspector('vaults')" title="Click to view Domain Vault Downloads">
          <div class="segment-header">
            <span class="segment-badge">SOVEREIGN VAULTS</span>
            <span class="segment-arrow">➔</span>
          </div>
          <h3 class="segment-title">📦 Domain Vault Assets</h3>
          <p class="segment-desc">
            <strong>Vault:</strong> ${activeRole.vaults.vault_name}<br/>
            <strong>Size:</strong> <code>${activeRole.vaults.size}</code>
          </p>
        </div>

        <!-- Card 4: Specialist AI Agents -->
        <div class="segment-card" onclick="openInspector('agents')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')openInspector('agents')" title="Click to view Specialist AI Agents">
          <div class="segment-header">
            <span class="segment-badge">SUBAGENT ROSTER</span>
            <span class="segment-arrow">➔</span>
          </div>
          <h3 class="segment-title">🤖 Specialist AI Agents</h3>
          <p class="segment-desc">
            Contains <strong>${activeRole.agents.length} Specialized Subagents</strong> tuned specifically for ${activeRole.category}.
          </p>
        </div>

        <!-- Card 5: Gateway Audit -->
        <div class="segment-card" onclick="openInspector('gateway')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')openInspector('gateway')" title="Click to view Gateway Audit & Compliance">
          <div class="segment-header">
            <span class="segment-badge">REGULATORY GATEWAY</span>
            <span class="segment-arrow">➔</span>
          </div>
          <h3 class="segment-title">🏛️ Gateway Audit</h3>
          <p class="segment-desc">
            <strong>Body:</strong> ${activeRole.gateway ? activeRole.gateway.statutory_body : 'Statutory Regulatory Body'}<br/>
            <strong>Sovereignty:</strong> ${activeRole.gateway ? activeRole.gateway.sovereignty : 'Air-Gapped Local Audit'}
          </p>
        </div>

        <!-- Card 6: Services Marketplace -->
        <div class="segment-card" onclick="openInspector('marketplace')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')openInspector('marketplace')" title="Click to order Custom Marketplace Reports">
          <div class="segment-header">
            <span class="segment-badge">MANAGED AUDITS</span>
            <span class="segment-arrow">➔</span>
          </div>
          <h3 class="segment-title">📊 Services Marketplace</h3>
          <p class="segment-desc">
            Order verified advisory dossiers, PUFE audit reports, and NCLT precedent briefs.
          </p>
        </div>
      `;
    }

    function renderWorkbenchIdeSimulator(role) {
      const sim = document.getElementById('workbenchIdeSimulator');
      const agentListHtml = role.agents.map(a => `
        <div class="ide-tree-item">
          <span>🤖</span> <span>${a.agent_name}</span>
        </div>
      `).join('');

      sim.innerHTML = `
        <div class="ide-header">
          <div class="ide-dots">
            <span class="ide-dot dot-red"></span>
            <span class="ide-dot dot-yellow"></span>
            <span class="ide-dot dot-green"></span>
          </div>
          <div class="ide-title">hayagriva-ide :: ${role.ide_config.workspace_name} — [Air-Gapped Local Environment]</div>
          <div style="font-size: 11px; font-family: var(--font-mono); color: #10B981;">● LOCAL ENGINE ONLINE</div>
        </div>
        <div class="ide-body">
          <!-- Sidebar Tree -->
          <div class="ide-sidebar">
            <div class="ide-tree-title">Domain Data Vault</div>
            <div class="ide-tree-item active">
              <span>📚</span> <span>${role.vaults.vault_name}</span>
            </div>
            
            <div class="ide-tree-title" style="margin-top: 16px;">AI Subagents</div>
            ${agentListHtml}

            <div class="ide-tree-title" style="margin-top: 16px;">Statutory Gateway</div>
            <div class="ide-tree-item">
              <span>🏛️</span> <span>${role.gateway ? role.gateway.statutory_body : 'Audit Gateway'}</span>
            </div>
          </div>

          <!-- Code / Workflow Editor -->
          <div class="ide-editor">
            <div class="ide-code-line"><span class="code-comment">// HAYAGRIVA Sovereign Professional IDE Environment</span></div>
            <div class="ide-code-line"><span class="code-comment">// Role: ${role.role_title} (${role.category})</span></div>
            <div class="ide-code-line"><span class="code-keyword">import</span> { <span class="code-var">SovereignVault</span> } <span class="code-keyword">from</span> <span class="code-string">'@hayagriva/vaults'</span>;</div>
            <div class="ide-code-line"><span class="code-keyword">import</span> { <span class="code-var">LocalLLM</span> } <span class="code-keyword">from</span> <span class="code-string">'@hayagriva/models'</span>;</div>
            <div class="ide-code-line">&nbsp;</div>
            <div class="ide-code-line"><span class="code-keyword">const</span> <span class="code-var">vault</span> = <span class="code-keyword">new</span> <span class="code-var">SovereignVault</span>({ file: <span class="code-string">'${role.vaults.download_file}'</span> });</div>
            <div class="ide-code-line"><span class="code-keyword">const</span> <span class="code-var">model</span> = <span class="code-keyword">new</span> <span class="code-var">LocalLLM</span>({ engine: <span class="code-string">'${role.llm.local_gguf}'</span> });</div>
            <div class="ide-code-line">&nbsp;</div>
            <div class="ide-code-line"><span class="code-comment">// Executing autonomous audit routine across domain statutes...</span></div>
            <div class="ide-code-line"><span class="code-keyword">const</span> <span class="code-var">auditReport</span> = <span class="code-keyword">await</span> <span class="code-var">model</span>.auditCompliance({</div>
            <div class="ide-code-line">&nbsp;&nbsp;statute: <span class="code-string">'${role.gateway ? role.gateway.statutory_body : "Statutory Code"}'</span>,</div>
            <div class="ide-code-line">&nbsp;&nbsp;privacy: <span class="code-string">'AIR_GAPPED_ZERO_TELEMETRY'</span></div>
            <div class="ide-code-line">});</div>
            <div class="ide-code-line">&nbsp;</div>
            <div class="ide-code-line"><span class="code-var">console</span>.log(<span class="code-string">'✅ Audit verified under 100% data sovereignty.'</span>);</div>
          </div>

          <!-- Live Output Panel -->
          <div class="ide-panel">
            <div class="ide-panel-title">Active AI Context</div>
            <div class="ide-panel-content">
              <p style="margin-bottom: 8px;"><strong>LLM:</strong> ${role.llm.model_name}</p>
              <p style="margin-bottom: 8px;"><strong>Vectors:</strong> ${role.embeddings.model_name}</p>
              <p style="margin-bottom: 8px;"><strong>Vault:</strong> ${role.vaults.size}</p>
              <p style="margin-bottom: 8px; color: #10B981;"><strong>Security:</strong> Complete Local Data Isolation</p>
              <div style="margin-top: 14px; border-top: 1px solid #334155; padding-top: 12px;">
                <a href="/downloads/hayagriva-ide-darwin-arm64.dmg" class="btn-download" style="display: block; text-align: center; font-size: 11px; padding: 6px 10px; background: #0284C7; color: #FFF; border-radius: 4px; font-weight: 700;">
                  ⬇️ Download Desktop IDE
                </a>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function openInspector(segmentType) {
      if (!activeRole) return;

      const panel = document.getElementById('panelRight');
      const title = document.getElementById('inspectorTitle');
      const content = document.getElementById('inspectorContent');

      if (window.HayaIdeDocking) {
        HayaIdeDocking.openRightPanel();
      } else {
        panel.classList.add('active');
      }

      if (segmentType === 'embeddings') {
        title.innerText = '🧠 Embedding Model Specifications';
        content.innerHTML = `
          <div class="inspector-section">
            <div class="inspector-sec-title">${activeRole.embeddings.model_name}</div>
            <div class="inspector-sec-text">
              <p><strong>Vector Dimensions:</strong> ${activeRole.embeddings.dimensions}</p>
              <p><strong>Domain Scope:</strong> ${activeRole.embeddings.scope}</p>
              <p style="margin-top: 8px;">Pre-calibrated semantic vectors trained exclusively on Indian jurisprudence, regulatory compliance filings, and statutory codes.</p>
            </div>
          </div>
          <div class="inspector-section">
            <div class="inspector-sec-title">Air-Gapped Integration</div>
            <div class="inspector-sec-text">
              Embeddings run locally in ONNX Runtime / CoreML format on your CPU/GPU without cloud API dependencies.
            </div>
          </div>
        `;
      } else if (segmentType === 'llm') {
        title.innerText = '⚡ LLM Reasoning Engines';
        content.innerHTML = `
          <div class="inspector-section">
            <div class="inspector-sec-title">${activeRole.llm.model_name}</div>
            <div class="inspector-sec-text">
              <p><strong>Architecture:</strong> ${activeRole.llm.parameters} Quantized Local GGUF</p>
              <p><strong>Local Binary:</strong> <code>${activeRole.llm.local_gguf}</code></p>
              <p style="margin-top: 8px;">Designed for high-precision legal interpretation, cross-statute validation, and clause anomaly detection.</p>
            </div>
          </div>
          <div class="inspector-section">
            <div class="inspector-sec-title">Hardware Requirements</div>
            <div class="inspector-sec-text">
              <p>• Apple Silicon (M1/M2/M3/M4) or Intel/AMD with 16GB+ RAM</p>
              <p>• Zero network transmission guaranteed by local socket architecture</p>
            </div>
          </div>
        `;
      } else if (segmentType === 'vaults') {
        title.innerText = '📦 Sovereign Data Vaults';
        content.innerHTML = `
          <div class="inspector-section">
            <div class="inspector-sec-title">${activeRole.vaults.vault_name}</div>
            <div class="inspector-sec-text">
              <p><strong>Package Size:</strong> ${activeRole.vaults.size}</p>
              <p><strong>Format:</strong> Structured SQLite + Indexed Markdown (.vlt)</p>
              <p style="margin-top: 8px;">Contains un-truncated, full-text statutory acts, amendments, case law headnotes, and circulars.</p>
            </div>
          </div>
          <div class="inspector-section">
            <div class="inspector-sec-title">Direct Vault Download</div>
            <div class="inspector-sec-text">
              <a href="/downloads/${activeRole.vaults.download_file}" class="btn-order-submit" style="display:block; text-align:center; text-decoration:none; margin-top:8px;">
                ⬇️ Download ${activeRole.vaults.download_file}
              </a>
            </div>
          </div>
        `;
      } else if (segmentType === 'agents') {
        title.innerText = '🤖 Specialized AI Subagents';
        const agentCards = activeRole.agents.map(a => `
          <div style="background: #FFF; border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; margin-bottom: 8px;">
            <div style="font-weight: 700; color: var(--primary-color); font-size: 13px;">${a.agent_name}</div>
            <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">${a.role}</div>
            <div style="font-size: 11px; font-family: var(--font-mono); color: #64748B; margin-top: 4px;">Trigger: ${a.trigger}</div>
          </div>
        `).join('');
        content.innerHTML = `
          <div class="inspector-section">
            <div class="inspector-sec-title">${activeRole.agents.length} Dedicated Subagent Routines</div>
            <div class="inspector-sec-text" style="margin-top: 8px;">
              ${agentCards}
            </div>
          </div>
        `;
      } else if (segmentType === 'gateway') {
        title.innerText = '🏛️ Statutory Regulatory Gateway';
        content.innerHTML = `
          <div class="inspector-section">
            <div class="inspector-sec-title">${activeRole.gateway ? activeRole.gateway.statutory_body : 'Statutory Regulatory Body'}</div>
            <div class="inspector-sec-text">
              <p><strong>Compliance Standard:</strong> ${activeRole.gateway ? activeRole.gateway.api_standard : 'Standard API'}</p>
              <p><strong>Sovereignty Model:</strong> ${activeRole.gateway ? activeRole.gateway.sovereignty : 'Air-Gapped'}</p>
              <p style="margin-top: 8px;">Integrates local signing subagents with government compliance e-portals.</p>
            </div>
          </div>
        `;
      } else if (segmentType === 'marketplace') {
        title.innerText = '📊 Services Marketplace';
        let services = [
          { title: 'CIRP Due Diligence & Form Verification Audit', price: '₹999', desc: 'Audits admitted claim forms against IBBI CIRP Regulations, 2016.' },
          { title: 'NCLT Bench Precedent Summary Report', price: '₹1,499', desc: 'Bench-wise analysis of recent NCLT & NCLAT admission and resolution precedents.' },
          { title: 'Promoter Track Record & PUFE Audit Report', price: '₹2,499', desc: 'Deep audit of preferential, undervalued, and fraudulent transactions (Sec 43-51, IBC).' },
          { title: 'Liquidation Valuation Benchmark Report', price: '₹1,999', desc: 'Cross-reference liquidation asset appraisals with historical NCLT auction benchmarks.' }
        ];

        if (activeRole.id === 'patent_attorneys') {
          services = [
            { title: 'Patent Prior Art Semantic Clearance Report', price: '₹2,499', desc: 'Deep vector search across 1.2M Indian patent specifications & IPO journal publications.' },
            { title: 'USPTO Office Action Response Audit & Linter', price: '₹1,999', desc: 'Automated antecedent basis linting and statutory rejection argument compiler.' }
          ];
        } else if (activeRole.id === 'corporate_advocates') {
          services = [
            { title: 'Supreme Court & High Court SLP Briefs', price: '₹3,499', desc: 'Special Leave Petition synopsis, list of dates, and InLegal-SBERT precedent similarity Brief.' },
            { title: 'Commercial Litigation Statutory Limitation Audit', price: '₹1,499', desc: 'Audits court fee calculations, limitation periods, and CPC procedural compliance.' }
          ];
        } else if (activeRole.id === 'arbitrators' || activeRole.id === 'contract_arbitrators') {
          services = [
            { title: 'Arbitral Award Section 31 Interest Audit', price: '₹2,499', desc: 'Calculates statutory post-award and pre-award interest under Sec 31(7) Arbitration Act 1996.' },
            { title: 'Evidence Admissibility & Exhibit Brief', price: '₹1,999', desc: 'Cross-indexes evidence bundles with Indian Evidence Act / BSA electronic records certificates.' }
          ];
        }

        content.innerHTML = `
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <p style="font-size: 13px; color: var(--text-muted);">
              Professional services offered by our company to <strong>${activeRole.role_title}</strong>:
            </p>
            ${services.map(s => `
              <div style="background: #FFF; border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; box-shadow: var(--card-shadow);">
                <span class="service-price-tag" style="float:right; font-weight:800; color:var(--primary-color);">${s.price}</span>
                <div style="font-weight: 700; font-size: 13.5px; color: var(--text-main); margin-bottom: 4px; padding-right: 60px;">${s.title}</div>
                <div style="font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-bottom: 10px;">${s.desc}</div>
                <button class="btn-order-submit" style="font-size: 12.5px; padding: 7px 12px; width:100%;" onclick="orderService('${s.title}')">
                  🛒 Request / Order Service
                </button>
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    function orderService(serviceTitle) {
      alert(`Thank you for requesting "${serviceTitle}"! Our specialized team will reach out to you shortly.`);
    }

    function closeInspector() {
      if (window.HayaIdeDocking) {
        HayaIdeDocking.closeRightPanel();
      } else {
        document.getElementById('panelRight').classList.remove('active');
      }
    }

    function checkAuthStatus() {
      const token = localStorage.getItem('haya_portal_token');
      const authBtn = document.getElementById('main-auth-btn');
      if (token && authBtn) {
        authBtn.textContent = 'Logout';
        authBtn.href = '#';
        authBtn.onclick = (e) => { e.preventDefault(); localStorage.removeItem('haya_portal_token'); window.location.reload(); };
      }
    }
  </script>
  <script src="js/ide-docking.js"></script>
  <script src="js/responsive.js"></script>
  <script src="js/components.js"></script>
</body>
</html>
