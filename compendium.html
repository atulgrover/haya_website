<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HPTI Compendium: Sanatani Psychology, Epic Archetypes & National Vocational Realization | HAYAGRIVA</title>
  <meta name="description" content="The 28-Chapter authoritative compendium on Vedic psychometrics, the ECCP framework, Ramayana and Mahabharata archetypes, and official NCVET/NSQF vocational mapping.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Marked parser with fallback -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --primary-navy: #0B192C;
      --azure-blue: #1E6C93;
      --azure-glow: #2563EB;
      --bg-light: #F8FAFC;
      --surface-card: #FFFFFF;
      --border-subtle: #E2E8F0;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --gold-accent: #D97706;
      --gold-light: #FEF3C7;
      --sanskrit-gold: #92400E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F1F5F9;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Compendium Header Bar */
    .comp-header {
      background: #0B192C;
      color: #FFFFFF;
      border-bottom: 2px solid #1E293B;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 100;
    }

    .comp-brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .comp-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: #F8FAFC;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .comp-back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: #60A5FA;
      color: #FFFFFF;
    }

    .comp-titles {
      display: flex;
      flex-direction: column;
    }

    .comp-title-main {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .comp-title-pill {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, #D97706, #B45309);
      color: #FFF;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
    }

    .comp-title-sub {
      font-size: 11.5px;
      color: #94A3B8;
      font-weight: 500;
    }

    .comp-header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .comp-cta-eval {
      padding: 8px 16px;
      background: linear-gradient(135deg, #1E6C93, #2563EB);
      color: #FFF;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
      transition: all 0.2s ease;
    }
    .comp-cta-eval:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.45);
    }

    /* Main Dual-Panel Workspace */
    .comp-workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* Left Sidebar: Table of Contents */
    .comp-sidebar {
      width: 380px;
      background: #FFFFFF;
      border-right: 1px solid #CBD5E1;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .comp-search-box {
      padding: 14px 16px;
      border-bottom: 1px solid #E2E8F0;
      background: #F8FAFC;
    }

    .comp-search-input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid #CBD5E1;
      font-size: 13px;
      background: #FFFFFF;
      color: #0F172A;
      outline: none;
      transition: border-color 0.2s;
    }
    .comp-search-input:focus {
      border-color: #2563EB;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    .comp-toc-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px 40px 14px;
    }

    .volume-group {
      margin-bottom: 20px;
    }

    .volume-header {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #1E6C93;
      padding: 6px 10px;
      background: #EFF6FF;
      border-left: 3px solid #2563EB;
      border-radius: 0 4px 4px 0;
      margin-bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .volume-subtitle {
      font-size: 10px;
      color: #64748B;
      font-weight: 500;
      text-transform: none;
      letter-spacing: normal;
    }

    .chapter-link {
      display: block;
      padding: 8px 10px;
      border-radius: 6px;
      text-decoration: none;
      color: #1E293B;
      font-size: 12.5px;
      line-height: 1.4;
      margin-bottom: 3px;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .chapter-link:hover {
      background: #F1F5F9;
      color: #0F172A;
      border-color: #CBD5E1;
    }

    .chapter-link.active {
      background: #EFF6FF;
      color: #1D4ED8;
      font-weight: 700;
      border-color: #BFDBFE;
    }

    .chapter-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #64748B;
      margin-bottom: 2px;
    }
    .chapter-link.active .chapter-meta {
      color: #2563EB;
    }

    .chapter-badge {
      font-size: 9.5px;
      font-weight: 700;
      background: #E2E8F0;
      color: #334155;
      padding: 1px 5px;
      border-radius: 3px;
    }
    .chapter-link.active .chapter-badge {
      background: #DBEAFE;
      color: #1E40AF;
    }

    /* Right Main Content Pane */
    .comp-reader {
      flex: 1;
      overflow-y: auto;
      background: #FFFFFF;
      padding: 40px 60px 80px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .reader-article {
      max-width: 860px;
      width: 100%;
    }

    /* Breadcrumbs */
    .reader-breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #64748B;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #E2E8F0;
    }
    .reader-breadcrumbs a {
      color: #1E6C93;
      text-decoration: none;
      font-weight: 600;
    }
    .reader-breadcrumbs a:hover {
      text-decoration: underline;
    }

    /* Markdown Typography Styling */
    .markdown-body {
      font-size: 15.5px;
      line-height: 1.75;
      color: #1E293B;
    }

    .markdown-body h1 {
      font-size: 28px;
      font-weight: 800;
      color: #0F172A;
      margin: 0 0 16px 0;
      line-height: 1.25;
      letter-spacing: -0.025em;
      border-bottom: 2px solid #E2E8F0;
      padding-bottom: 12px;
    }

    .markdown-body h2 {
      font-size: 21px;
      font-weight: 700;
      color: #0B192C;
      margin: 36px 0 14px 0;
      letter-spacing: -0.015em;
      border-bottom: 1px solid #F1F5F9;
      padding-bottom: 8px;
    }

    .markdown-body h3 {
      font-size: 17px;
      font-weight: 700;
      color: #1E6C93;
      margin: 26px 0 10px 0;
    }

    .markdown-body p {
      margin-bottom: 16px;
    }

    .markdown-body blockquote {
      border-left: 4px solid #D97706;
      background: #FFFBEB;
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      margin: 20px 0;
      color: #78350F;
      font-style: italic;
    }

    .markdown-body blockquote p {
      margin-bottom: 6px;
    }
    .markdown-body blockquote p:last-child {
      margin-bottom: 0;
    }

    .markdown-body ul, .markdown-body ol {
      margin: 0 0 18px 24px;
      padding-left: 6px;
    }

    .markdown-body li {
      margin-bottom: 8px;
    }

    .markdown-body code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      background: #F1F5F9;
      padding: 2px 6px;
      border-radius: 4px;
      color: #0F172A;
      border: 1px solid #E2E8F0;
    }

    .markdown-body pre {
      background: #0B192C;
      color: #F8FAFC;
      padding: 16px 20px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 20px 0;
    }

    .markdown-body pre code {
      background: transparent;
      border: none;
      color: #E2E8F0;
      padding: 0;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 24px 0;
      font-size: 13.5px;
    }

    .markdown-body th, .markdown-body td {
      border: 1px solid #CBD5E1;
      padding: 10px 14px;
      text-align: left;
    }

    .markdown-body th {
      background: #0B192C;
      color: #FFFFFF;
      font-weight: 700;
    }

    .markdown-body tr:nth-child(even) {
      background: #F8FAFC;
    }

    .markdown-body hr {
      border: none;
      border-top: 1px solid #CBD5E1;
      margin: 36px 0;
    }

    /* Chapter Footer Navigation */
    .reader-footer-nav {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 2px solid #E2E8F0;
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }

    .nav-btn {
      padding: 12px 18px;
      border-radius: 6px;
      border: 1px solid #CBD5E1;
      background: #F8FAFC;
      color: #0F172A;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
      cursor: pointer;
      max-width: 45%;
    }
    .nav-btn:hover {
      background: #EFF6FF;
      border-color: #60A5FA;
      color: #1D4ED8;
    }
    .nav-btn span {
      font-size: 10.5px;
      color: #64748B;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 2px;
    }

    /* Loading Spinner */
    .reader-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 400px;
      color: #64748B;
      gap: 12px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #E2E8F0;
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      .comp-workspace {
        flex-direction: column;
      }
      .comp-sidebar {
        width: 100%;
        height: 240px;
        border-right: none;
        border-bottom: 1px solid #CBD5E1;
      }
      .comp-reader {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Compendium Top Navigation -->
  <header class="comp-header">
    <div class="comp-brand">
      <a href="/personalities.html" class="comp-back-btn">
        <span>←</span> Return to HPTI Diagnostic
      </a>
      <div class="comp-titles">
        <div class="comp-title-main">
          HPTI Master Compendium
          <span class="comp-title-pill">28 Chapters</span>
        </div>
        <div class="comp-title-sub">
          Sanatani Psychology • ECCP Framework • Ramayana &amp; Mahabharata • NSQF / NCVET
        </div>
      </div>
    </div>
    <div class="comp-header-actions">
      <a href="/personalities.html" class="comp-cta-eval">
        🏹 Take Personality Test
      </a>
    </div>
  </header>

  <!-- Workspace: TOC + Reader -->
  <div class="comp-workspace">
    
    <!-- Left Sidebar: TOC -->
    <aside class="comp-sidebar">
      <div class="comp-search-box">
        <input type="text" id="compSearchInput" class="comp-search-input" placeholder="🔍 Search chapter, topic or shloka..." oninput="filterChapters()" />
      </div>
      <div class="comp-toc-scroll" id="tocContainer">
        <!-- Rendered dynamically -->
        <div class="reader-spinner" style="min-height: 120px;">
          <div class="spinner" style="width: 24px; height: 24px;"></div>
          <span style="font-size: 11px;">Loading Table of Contents...</span>
        </div>
      </div>
    </aside>

    <!-- Main Reader Area -->
    <main class="comp-reader" id="readerContainer">
      <article class="reader-article">
        <!-- Breadcrumbs -->
        <div class="reader-breadcrumbs" id="readerBreadcrumbs">
          <a href="/personalities.html">HPTI Portal</a> ➔ <span>Compendium</span> ➔ <strong id="bcCurrentChapter">Loading...</strong>
        </div>

        <!-- Markdown Content Container -->
        <div class="markdown-body" id="chapterMarkdown">
          <div class="reader-spinner">
            <div class="spinner"></div>
            <span>Loading Shastric Chapter...</span>
          </div>
        </div>

        <!-- Prev / Next Navigation -->
        <div class="reader-footer-nav" id="readerFooterNav" style="display: none;">
          <button class="nav-btn" id="btnPrevChapter" onclick="navigateChapter(-1)">
            <span>← Previous Chapter</span>
            <div id="labelPrevChapter">Chapter Title</div>
          </button>
          <button class="nav-btn" id="btnNextChapter" style="text-align: right; align-items: flex-end;" onclick="navigateChapter(1)">
            <span>Next Chapter →</span>
            <div id="labelNextChapter">Chapter Title</div>
          </button>
        </div>
      </article>
    </main>

  </div>

  <script>
    // Compendium Reader State
    let compendiumData = null;
    let allChaptersFlat = [];
    let currentChapterIndex = 0;

    // Fast inline markdown parser fallback in case CDN blocked
    function parseMarkdownBasic(text) {
      if (window.marked && window.marked.parse) {
        return window.marked.parse(text);
      }
      // Simple fallback
      let html = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/^\> (.*$)/gim, '<blockquote><p>$1</p></blockquote>')
        .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/gim, '<em>$1</em>')
        .replace(/\n\n/gim, '</p><p>')
        .replace(/\n/gim, '<br/>');
      return '<p>' + html + '</p>';
    }

    async function initCompendium() {
      try {
        const res = await fetch('/api/personalities/compendium/toc');
        const data = await res.json();
        if (!data.success) throw new Error('Failed to load TOC');
        compendiumData = data;

        // Flatten chapters for sequential navigation
        allChaptersFlat = [];
        data.volumes.forEach(vol => {
          vol.chapters.forEach(ch => {
            allChaptersFlat.push({
              ...ch,
              volume_num: vol.volume,
              volume_title: vol.volume_title
            });
          });
        });

        renderTOC();

        // Check URL search params for chapter deep link
        const urlParams = new URLSearchParams(window.location.search);
        const reqFile = urlParams.get('chapter') || urlParams.get('file');

        let targetIndex = 0;
        if (reqFile) {
          const foundIdx = allChaptersFlat.findIndex(c => 
            c.file.toLowerCase().includes(reqFile.toLowerCase()) || 
            String(c.num) === reqFile ||
            c.title.toLowerCase().includes(reqFile.toLowerCase())
          );
          if (foundIdx !== -1) targetIndex = foundIdx;
        }

        loadChapterByIndex(targetIndex);

      } catch (err) {
        console.error('Compendium init failed:', err);
        document.getElementById('tocContainer').innerHTML = `
          <div style="padding: 20px; color: #DC2626; font-size: 13px;">
            ⚠️ Failed to load Compendium TOC. Ensure server is running.
          </div>
        `;
      }
    }

    function renderTOC(filterTerm = '') {
      const container = document.getElementById('tocContainer');
      const term = filterTerm.trim().toLowerCase();

      let html = '';

      compendiumData.volumes.forEach(vol => {
        const matchingChapters = vol.chapters.filter(ch => 
          !term || ch.title.toLowerCase().includes(term) || ch.summary.toLowerCase().includes(term) || `ch ${ch.num}`.includes(term)
        );

        if (matchingChapters.length > 0) {
          html += `
            <div class="volume-group">
              <div class="volume-header">
                <div>Vol ${vol.volume}: ${vol.volume_title}</div>
                <div class="volume-subtitle">${vol.subtitle}</div>
              </div>
              <div class="volume-chapters">
                ${matchingChapters.map(ch => {
                  const flatIdx = allChaptersFlat.findIndex(c => c.file === ch.file);
                  const isActive = flatIdx === currentChapterIndex;
                  return `
                    <div class="chapter-link ${isActive ? 'active' : ''}" id="tocLink_${flatIdx}" onclick="loadChapterByIndex(${flatIdx})">
                      <div class="chapter-meta">
                        <span class="chapter-badge">Ch ${ch.num}</span>
                        <span>•</span>
                        <span>Vol ${vol.volume}</span>
                      </div>
                      <div style="font-weight: ${isActive ? '700' : '500'};">${ch.title}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }
      });

      if (!html) {
        html = `<div style="padding: 20px; color: #64748B; font-size: 13px; text-align: center;">No matching chapters found.</div>`;
      }

      container.innerHTML = html;
    }

    function filterChapters() {
      const q = document.getElementById('compSearchInput').value;
      renderTOC(q);
    }

    async function loadChapterByIndex(index) {
      if (index < 0 || index >= allChaptersFlat.length) return;
      currentChapterIndex = index;
      const ch = allChaptersFlat[index];

      // Update active styling in TOC
      document.querySelectorAll('.chapter-link').forEach(l => l.classList.remove('active'));
      const activeEl = document.getElementById(`tocLink_${index}`);
      if (activeEl) {
        activeEl.classList.add('active');
        activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }

      // Update Breadcrumbs
      document.getElementById('bcCurrentChapter').innerText = `Ch ${ch.num}: ${ch.title}`;

      // Update URL without full reload
      const newUrl = `${window.location.pathname}?chapter=${encodeURIComponent(ch.file)}`;
      window.history.replaceState({ path: newUrl }, '', newUrl);

      // Loading state
      const mdContainer = document.getElementById('chapterMarkdown');
      mdContainer.innerHTML = `
        <div class="reader-spinner">
          <div class="spinner"></div>
          <span>Loading Chapter ${ch.num}...</span>
        </div>
      `;
      document.getElementById('readerFooterNav').style.display = 'none';

      // Scroll reader to top
      document.getElementById('readerContainer').scrollTop = 0;

      try {
        const res = await fetch(`/api/personalities/compendium/chapter?file=${encodeURIComponent(ch.file)}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Failed to fetch chapter');

        // Render Markdown
        mdContainer.innerHTML = parseMarkdownBasic(data.markdown);

        // Update Prev / Next buttons
        const navFooter = document.getElementById('readerFooterNav');
        navFooter.style.display = 'flex';

        const btnPrev = document.getElementById('btnPrevChapter');
        if (index > 0) {
          btnPrev.style.visibility = 'visible';
          document.getElementById('labelPrevChapter').innerText = `Ch ${allChaptersFlat[index - 1].num}: ${allChaptersFlat[index - 1].title}`;
        } else {
          btnPrev.style.visibility = 'hidden';
        }

        const btnNext = document.getElementById('btnNextChapter');
        if (index < allChaptersFlat.length - 1) {
          btnNext.style.visibility = 'visible';
          document.getElementById('labelNextChapter').innerText = `Ch ${allChaptersFlat[index + 1].num}: ${allChaptersFlat[index + 1].title}`;
        } else {
          btnNext.style.visibility = 'hidden';
        }

      } catch (err) {
        console.error('Chapter fetch failed:', err);
        mdContainer.innerHTML = `
          <div style="padding: 30px; background: #FEF2F2; border: 1px solid #FECACA; border-radius: 8px; color: #991B1B;">
            <h3>⚠️ Error Loading Chapter</h3>
            <p>${err.message}</p>
          </div>
        `;
      }
    }

    function navigateChapter(delta) {
      loadChapterByIndex(currentChapterIndex + delta);
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', initCompendium);
  </script>
</body>
</html>
