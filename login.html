<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — HAYAGRIVA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --color-primary: #0284c7;
      --color-primary-hover: #0369a1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #f8fafc;
      --input-border: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      background-color: var(--bg-page);
      background-image: 
        radial-gradient(at 0% 0%, rgba(2, 132, 199, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.05) 0px, transparent 50%);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2.75rem 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(15, 23, 42, 0.04);
    }
    .auth-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--color-primary);
      margin-bottom: 0.5rem;
      text-align: center;
      letter-spacing: -0.02em;
    }
    .auth-sub {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 2.25rem;
      line-height: 1.4;
    }
    .form-group {
      margin-bottom: 1.35rem;
    }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      color: #334155;
      margin-bottom: 0.45rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .form-group input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--color-primary);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
    }
    .btn-auth {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
      transition: all 0.2s ease;
    }
    .btn-auth:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
    }
    .btn-auth:active {
      transform: translateY(0);
    }
    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 0.85rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      margin-bottom: 1.25rem;
      text-align: center;
      display: none;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-title">HAYA PORTAL</div>
    <div class="auth-sub" id="form-subtitle">Login to access licenses &amp; downloads</div>

    <div class="error-msg" id="error-box"></div>

    <form id="auth-form">
      <div class="form-group">
        <label>EMAIL ADDRESS</label>
        <input type="email" id="email" required placeholder="name@firm.com" />
      </div>

      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>

      <button type="submit" class="btn-auth" id="btn-submit">Login →</button>
    </form>
  </div>

  <script>
    document.getElementById('auth-form').onsubmit = async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('error-box');
      errBox.style.display = 'none';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('haya_portal_token', data.token);
          window.location.href = 'dashboard.html';
        } else {
          errBox.innerText = data.error || 'Authentication failed.';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.innerText = 'Connection error.';
        errBox.style.display = 'block';
      }
    };
  </script>
</body>
</html>
